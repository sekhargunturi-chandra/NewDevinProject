# Copy to application.yml (or use env vars). Placeholders only - no secrets.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fasystem?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

capstone:
  processor-mode: rules        # rules | spring-ai | langchain4j
  human-review-required: true
  allow-financial-actions: false
  allow-customer-contact: false
  llm:
    provider: demo             # demo | <provider>
    api-key: ${LLM_API_KEY}    # never commit a real key
  retrieval:
    top-k: 4
    similarity-threshold: 0.25
  memory:
    max-messages: 12
  tools:
    timeout-ms: 2500
    deterministic-seed: fraud-training-v1
